- clean: ["~"]

- link:
    ~/bin:
        path: bin/
        relink: true
    ~/.profile: profile
    ~/.bashrc: bashrc
    ~/.bashrc.d: bashrc.d
    ~/.bash_logout: bash_logout
    ~/.bash_functions: bash_functions
    ~/.bash_aliases: bash_aliases
    ~/.gitconfig: gitconfig
    ~/.xinitrc: xinitrc
    ~/.vimrc: vimrc
    ~/.vim:
        path: vim/
        relink: true
    ~/.digrc: digrc
    ~/.bash-preexec.sh: bash-preexec.sh
    ~/backup:
      path: rclone-wrapper/
      create: true

- shell:
    - [git submodule update --init --recursive, Installing submodules]
    - command: ./install-scripts/check_permissions.sh
      description: Verifying script permissions
      quiet: false
    - command: "[ -f ~/.gitconfig.local ] || echo -e '[user]\n  signingkey =' > ~/.gitconfig.local"
      description: Creating ~/.gitconfig.local if it does not exist
      quiet: true
    - command: "./install-scripts/check_sudoers.sh"
      description: Checking sudoers setup
      quiet: false
    - command: "./install-scripts/check_ssh.sh"
      description: Checking SSH key setup
      quiet: false
    - command: "./install-scripts/check_gpg.sh"
      description: Checking GPG configuration for Git signing
      quiet: false
    - command: "./install-scripts/install_apt_packages.sh"
      description: Installing APT packages
      quiet: false
    - command: "./install-scripts/install_nerdfonts.sh"
      description: Installing Nerd Fonts
      quiet: false
    - command: "./install-scripts/install_starship.sh"
      description: Installing Starship prompt
      quiet: false
    - command: "./install-scripts/install_tailscale.sh"
      description: Installing Tailscale
      quiet: false
    - command: "./install-scripts/install_atuin.sh"
      description: Installing Atuin
      quiet: false
    - command: "./install-scripts/install_docker.sh"
      description: Installing Docker
      quiet: false
    - command: "./install-scripts/install_nvm.sh"
      description: Installing nvm (Node Version Manager)
      quiet: false
    - command: "./install-scripts/install_lazygit.sh"
      description: Installing Lazygit
      quiet: false
    - command: "./install-scripts/install_sublime.sh"
      description: Installing Sublime Text
      quiet: false
    - command: "./install-scripts/install_vscode.sh"
      description: Installing VSCode
      quiet: false
    - command: "./install-scripts/install_dbeaver.sh"
      description: Installing Dbeaver
      quiet: false
