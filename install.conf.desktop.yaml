- link:
    ~/.xinitrc: xinitrc

- shell:
    - command: "./install-scripts/check_gpg.sh"
      description: Checking GPG configuration for Git signing
      quiet: false
    - command: "./install-scripts/install_sublime.sh"
      description: Installing Sublime Text
      quiet: false
    - command: "./install-scripts/install_vscode.sh"
      description: Installing VSCode
      quiet: false
    - command: "./install-scripts/install_dbeaver.sh"
      description: Installing Dbeaver
      quiet: false
